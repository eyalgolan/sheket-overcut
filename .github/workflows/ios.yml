name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "contract/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "contract/**"
      - ".github/workflows/ios.yml"

# Read the repository and nothing else. No AWS credentials exist in this
# workflow.
permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/SheketCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
